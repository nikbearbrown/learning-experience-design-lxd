  <rect x="552" y="140" width="116" height="284" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="610" y="250" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">competent work</text>
  <text x="610" y="270" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454" text-anchor="middle">maybe good UX,</text>
  <text x="610" y="286" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454" text-anchor="middle">maybe solid ID &#8212;</text>
