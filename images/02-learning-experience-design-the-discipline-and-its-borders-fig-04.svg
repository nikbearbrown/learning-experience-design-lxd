  <!-- Caption -->
  <text x="32" y="556" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">A deliverable counts as LXD only if it survives all three questions. The shared exit is a compression &#8212;</text>
  <text x="32" y="572" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the chapter assigns no distinct destination per failed question; failed work may still be good UX or ID.</text>
