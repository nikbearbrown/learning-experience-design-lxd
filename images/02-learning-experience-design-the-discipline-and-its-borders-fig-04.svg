  <polygon points="196,402 300,356 404,402 300,448" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="300" y="398" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">delayed or transfer</text>
  <text x="300" y="412" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">measure actually taken?</text>
