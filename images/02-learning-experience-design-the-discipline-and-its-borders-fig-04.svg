  <text x="300" y="278" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">decisions constrained by</text>
  <text x="300" y="292" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">evidence about learning?</text>
  <line x1="300" y1="328" x2="300" y2="352" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="308" y="346" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#545454">yes</text>

