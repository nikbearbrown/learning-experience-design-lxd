  <text x="300" y="158" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">learning outcome stated</text>
  <text x="300" y="172" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">before design began?</text>
  <line x1="300" y1="208" x2="300" y2="232" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="308" y="226" font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#545454">yes</text>

