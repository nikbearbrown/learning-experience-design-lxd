<svg viewBox="0 0 700 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-ch02-04">
  <title id="fig-title-ch02-04">The Constraint Test: Three Questions Any LXD Deliverable Must Survive — 02-learning-experience-design-the-discipline-and-its-borders</title>
  <desc>A deliverable counts as LXD only if it survives three sequential questions — outcome stated before design, decisions constrained by learning evidence, delayed or transfer measure taken. Failing them means good UX or solid ID, not LXD.</desc>
