<!-- Figure 04 — The guardrailed channel: gate, ladder, blocked answer path, return loop · Chapter 12: AI in the Learning Experience · Experience Design for EdTech · Nik Bear Brown · Generated 2026-06-07 -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-12-04">
  <title id="fig-title-12-04">The guardrailed channel: gate, ladder, blocked answer path, return loop — 12-ai-in-the-learning-experience-scaffold-or-crutch</title>
  <desc>Systems diagram: the learner passes an attempt-first gate to a three-rung hint ladder whose help loops back via self-explanation; the short straight path to a complete answer is cut by a blocking bar two-thirds of the way along.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="12-ai-in-the-learning-experience-scaffold-or-crutch" figure-number="04" figure-title="The guardrailed channel: gate, ladder, blocked answer path, return loop" figure-slug="guardrailed-channel" figure-type="systems" priority="important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/12-ai-in-the-learning-experience-scaffold-or-crutch-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="64" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The guardrailed channel: gate, ladder, blocked answer path, return loop</text>

  <!-- blocked direct-answer path (short, straight, dashed, cut by ⊣) -->
  <path d="M124 232 C 150 200, 160 150, 200 150 L 426 150" fill="none" stroke="#787878" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="430" y1="136" x2="430" y2="164" stroke="#2a1a0e" stroke-width="2.5"/>
  <text x="290" y="136" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">the direct answer path — short, straight, blocked</text>
  <rect x="560" y="122" width="108" height="56" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="614" y="146" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">complete answer</text>
  <text x="614" y="162" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454" text-anchor="middle">never delivered</text>

  <!-- learner -->
  <circle cx="110" cy="250" r="22" fill="#FFFFFF" stroke="#787878" stroke-width="1"/>
  <text x="110" y="254" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">learner</text>

  <!-- sanctioned route: attempt → gate → ladder -->
  <line x1="132" y1="250" x2="164" y2="250" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="172" y="242" width="16" height="16" fill="#2a1a0e"/>
  <text x="180" y="276" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454" text-anchor="middle">attempt</text>
  <line x1="188" y1="250" x2="214" y2="250" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="224" y1="222" x2="224" y2="278" stroke="#2a1a0e" stroke-width="2"/>
  <line x1="234" y1="222" x2="234" y2="278" stroke="#2a1a0e" stroke-width="2"/>
  <text x="229" y="212" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">attempt-first gate</text>
  <line x1="238" y1="250" x2="280" y2="250" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- hint ladder (highlighted design element) -->
  <rect x="288" y="196" width="64" height="108" fill="#FFFFFF" stroke="#C8102E" stroke-width="1.5"/>
  <line x1="296" y1="226" x2="344" y2="226" stroke="#C8102E" stroke-width="1.5"/>
  <line x1="296" y1="250" x2="344" y2="250" stroke="#C8102E" stroke-width="1.5"/>
  <line x1="296" y1="274" x2="344" y2="274" stroke="#C8102E" stroke-width="1.5"/>
  <text x="320" y="186" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">hint ladder</text>
  <text x="360" y="230" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454">3 · worked sub-step</text>
  <text x="360" y="254" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454">2 · concept pointer</text>
  <text x="360" y="278" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454">1 · orienting question</text>

  <!-- self-explanation return loop (long, circuitous, back to the learner) -->
  <path d="M320 304 C 320 352, 240 360, 170 360 C 120 360, 100 320, 107 278" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="320" y="380" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">self-explanation loop — every delivered help returns to the learner's own work</text>

  <text x="64" y="404" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The sanctioned route is long and circuitous — attempt, gate, graduated hints, self-explanation; the easy straight path is cut outright (⊣).</text>
</svg>
