<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-05">
  <title id="fig-title-05">The Removal Test — 04-motivation-by-design-self-determination-flow-and-task-value</title>
  <desc>Decision flow: a motivation mechanic under evaluation passes through one question — what kind of motivation does it recruit — and fans to three predicted outcomes when the mechanic is removed: displacement below baseline, decay back to baseline, or sustained behavior, each shown as a small trace against a dashed baseline.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="04-motivation-by-design-self-determination-flow-and-task-value" figure-number="05" figure-title="The Removal Test" figure-slug="removal-test" figure-type="process-flowchart" priority="Supplementary" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/04-motivation-by-design-self-determination-flow-and-task-value-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="32" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The Removal Test</text>

  <!-- mechanic node -->
  <rect x="250" y="48" width="200" height="44" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="67" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e">Motivation mechanic</text>
  <text x="350" y="83" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">under evaluation</text>

  <line x1="350" y1="92" x2="350" y2="122" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- decision diamond -->
  <polygon points="350,126 440,170 350,214 260,170" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="350" y="160" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">what kind of</text>
  <text x="350" y="174" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">motivation does</text>
  <text x="350" y="188" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">it recruit?</text>

  <!-- branch arrows (orthogonal) -->
  <path d="M 350 214 L 350 232 L 140 232 L 140 252" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="350" y1="214" x2="350" y2="252" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 350 214 L 350 232 L 560 232 L 560 252" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- terminal: displacement (worst) -->
  <rect x="50" y="256" width="180" height="96" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="140" y="276" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e">Displacement</text>
  <text x="140" y="291" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">external reward displaced</text>
  <text x="140" y="303" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">existing meaning</text>
  <line x1="70" y1="328" x2="210" y2="328" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 70 328 L 92 328 C 102 328 104 314 114 314 C 126 314 132 324 144 336 L 168 344" fill="none" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- terminal: decay to baseline -->
  <rect x="260" y="256" width="180" height="96" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="350" y="276" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e">Decay to baseline</text>
  <text x="350" y="291" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">behavior was carried by</text>
  <text x="350" y="303" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">the mechanic alone</text>
  <line x1="280" y1="328" x2="420" y2="328" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 280 328 L 302 328 C 312 328 314 314 324 314 C 336 314 344 324 364 328 L 402 328" fill="none" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- terminal: sustain (durable case, highlighted) -->
  <rect x="470" y="256" width="180" height="96" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="560" y="276" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e">Sustain</text>
  <text x="560" y="291" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">internalized or intrinsic —</text>
  <text x="560" y="303" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">nothing external to remove</text>
  <line x1="490" y1="328" x2="630" y2="328" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <path d="M 490 328 L 506 328 C 514 328 516 318 526 317 L 612 316" fill="none" stroke="#C8102E" stroke-width="2"/>

  <!-- outcome note -->
  <text x="140" y="372" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">lands below baseline</text>
  <text x="350" y="372" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">returns to baseline</text>
  <text x="560" y="372" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">holds above baseline</text>

  <!-- caption -->
  <text x="32" y="404" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The removal test: predict what behavior does when the mechanic is taken away — it sustains, decays to baseline, or lands below it.</text>
</svg>
