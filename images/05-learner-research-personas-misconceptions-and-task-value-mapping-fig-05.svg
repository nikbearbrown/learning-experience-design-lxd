  <desc>Left-to-right pipeline: inherited assumptions, a failed survey crossed by a slash, an LLM-generated list of six candidate misconceptions, a five-interview filter where four candidates terminate and two survive, and two evidence-based personas; below, a verdict bar shows time-poor confirmed and underprepared overruled.</desc>
