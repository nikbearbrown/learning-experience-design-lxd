<!-- Figure 05 — The pre-training prescription: learn the medium before the lesson · Chapter 11: Immersive and Embodied Learning · Experience Design for EdTech · Nik Bear Brown · Generated 2026-06-07 -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-11-05">
  <title id="fig-title-11-05">The pre-training prescription: learn the medium before the lesson — 11-immersive-and-embodied-learning-when-the-medium-earns-its-cost</title>
  <desc>Linear process: a content-free sandbox session, then a comfort and sickness screen, then — after a dotted session break — learning content in session two or later; an equal-rank flat-screen equivalent branches from the screen for those who opt out.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="11-immersive-and-embodied-learning-when-the-medium-earns-its-cost" figure-number="05" figure-title="The pre-training prescription: learn the medium before the lesson" figure-slug="pre-training-prescription" figure-type="flowchart" priority="supplementary" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/11-immersive-and-embodied-learning-when-the-medium-earns-its-cost-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="64" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The pre-training prescription: learn the medium before the lesson</text>

  <!-- sandbox session -->
  <rect x="40" y="125" width="150" height="70" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="115" y="149" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">sandbox session</text>
  <text x="115" y="166" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">locomotion, grabbing, menus</text>
  <text x="115" y="180" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">content-free, throwaway</text>

  <line x1="190" y1="160" x2="222" y2="160" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- comfort & sickness screen -->
  <polygon points="288,115 348,160 288,205 228,160" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="288" y="156" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">comfort &amp;</text>
  <text x="288" y="170" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">sickness screen</text>

  <!-- session break (ellipsis) then content -->
  <line x1="348" y1="160" x2="392" y2="160" stroke="#2a1a0e" stroke-width="1.5"/>
  <circle cx="406" cy="160" r="2.5" fill="#787878"/>
  <circle cx="420" cy="160" r="2.5" fill="#787878"/>
  <circle cx="434" cy="160" r="2.5" fill="#787878"/>
  <text x="420" y="142" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">session break</text>
  <line x1="448" y1="160" x2="486" y2="160" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="492" y="125" width="170" height="70" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="577" y="155" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">learning content</text>
  <text x="577" y="172" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">no earlier than session two</text>

  <!-- opt-out branch: equal rank -->
  <line x1="288" y1="205" x2="288" y2="252" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="296" y="234" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454">opts out</text>
  <rect x="203" y="258" width="170" height="70" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="288" y="288" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">flat-screen equivalent</text>
  <text x="288" y="305" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">same content, equal rank</text>

  <text x="64" y="378" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Sandbox first, a sickness screen with a dignified flat-screen opt-out, and content no earlier than the learner's</text>
  <text x="64" y="393" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">second session — both endpoints are equal-rank learning paths, not a prize and a consolation.</text>
</svg>
