  <text x="164" y="261" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="end">first headset session</text>
  <rect x="176" y="224" width="166" height="48" fill="#ADADAD"/>
