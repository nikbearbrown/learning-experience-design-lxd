  <!-- segment labels above top bar -->
  <g font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="middle">
    <text x="260" y="115">intrinsic (the content)</text>
    <text x="356" y="115">extraneous</text>
    <text x="512" y="115">germane (the learning)</text>
  </g>

  <!-- touch tank bar: intrinsic 35 / extraneous 5 / germane 60 -->
  <text x="164" y="146" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="end">touch tank</text>
  <text x="164" y="161" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="end">familiar medium</text>
