<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-11-03">
  <title id="fig-title-11-03">Same budget, different spending: the working-memory allocation — 11-immersive-and-embodied-learning-when-the-medium-earns-its-cost</title>
  <desc>Two stacked proportion bars of identical total length: the touch-tank bar spends a sliver on interface overhead and most capacity on learning; the novice-VR bar's hatched interface slice consumes roughly half the budget, shrinking the red germane slice.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="11-immersive-and-embodied-learning-when-the-medium-earns-its-cost" figure-number="03" figure-title="Same budget, different spending: the working-memory allocation" figure-slug="load-allocation-arithmetic" figure-type="statistical" priority="important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/11-immersive-and-embodied-learning-when-the-medium-earns-its-cost-cajal.md"/></metadata>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="6" height="6" fill="#FFFFFF"/>
      <line x1="0" y1="0" x2="0" y2="6" stroke="#787878" stroke-width="1.5"/>
    </pattern>
  </defs>

  <text x="64" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Same budget, different spending: the working-memory allocation</text>

  <!-- budget limit marker -->
  <text x="656" y="92" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="end">fixed budget — the total does not grow</text>
  <line x1="656" y1="100" x2="656" y2="285" stroke="#787878" stroke-width="0.75" stroke-dasharray="5 4"/>
  <!-- shared left baseline -->
