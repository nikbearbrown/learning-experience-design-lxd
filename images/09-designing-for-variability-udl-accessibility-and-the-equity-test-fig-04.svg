<svg viewBox="0 0 700 480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-04">
  <title id="fig-title-04">The Barrier-First Audit Workflow — 09-designing-for-variability-udl-accessibility-and-the-equity-test</title>
  <desc>Four abstract learner profiles walk the experience; barriers are logged, then become a change table with one justification logic per row. Adaptive rows drop to the equity test, where a barred exit marks a decline. The workflow ends at a dashed open circle: verification by real assistive-tech users is still owed.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="09-designing-for-variability-udl-accessibility-and-the-equity-test" figure-number="04" figure-title="The Barrier-First Audit Workflow" figure-slug="barrier-first-audit-workflow" figure-type="process-flow-with-branch" priority="Important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/09-designing-for-variability-udl-accessibility-and-the-equity-test-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#787878"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Figure 9.4 · The Barrier-First Audit Workflow</text>

  <text x="170" y="100" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">walk the experience as each profile</text>

  <!-- four documented profiles (abstract shapes, deliberately not human figures) -->
  <circle cx="72" cy="140" r="10" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <rect x="62" y="162" width="20" height="20" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <polygon points="72,196 83,216 61,216" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <polygon points="72,231 82.5,239 78.5,252 65.5,252 61.5,239" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="76" y="276" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">learner profiles</text>
  <text x="76" y="290" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">(documented)</text>

  <!-- the experience under audit -->
  <rect x="122" y="110" width="44" height="166" fill="#F5F5F5" stroke="#D4D4D4" stroke-width="1"/>
  <text x="144" y="193" transform="rotate(-90 144 193)" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the experience under audit</text>

  <!-- walk arrows -->
  <path d="M88,140 L198,140" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M88,172 L198,172" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M88,206 L198,206" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M88,242 L198,242" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>

  <!-- barrier log -->
  <rect x="204" y="118" width="88" height="150" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="248" y="140" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">BARRIER</text>
  <text x="248" y="154" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">LOG</text>
  <line x1="216" y1="176" x2="280" y2="176" stroke="#787878" stroke-width="2"/>
  <line x1="216" y1="198" x2="280" y2="198" stroke="#787878" stroke-width="2"/>
  <line x1="216" y1="220" x2="280" y2="220" stroke="#787878" stroke-width="2"/>
  <line x1="216" y1="242" x2="280" y2="242" stroke="#787878" stroke-width="2"/>

  <path d="M292,193 L322,193" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- change table: one justification logic per row (echoes Figure 9.1 glyphs) -->
  <rect x="328" y="118" width="160" height="150" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="408" y="138" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">CHANGE TABLE</text>
  <text x="408" y="152" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">one logic per row</text>
  <line x1="328" y1="160" x2="488" y2="160" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="328" y1="196" x2="488" y2="196" stroke="#D4D4D4" stroke-width="1"/>
  <line x1="328" y1="232" x2="488" y2="232" stroke="#D4D4D4" stroke-width="1"/>
  <path d="M344,170 l7,3 v4 c0,5 -3.5,8 -7,10 c-3.5,-2 -7,-5 -7,-10 v-4 z" fill="none" stroke="#2a1a0e" stroke-width="1.25"/>
  <text x="360" y="182" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">obligated</text>
  <rect x="338" y="206" width="13" height="17" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.25"/>
  <text x="360" y="218" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">evidence-supported</text>
  <circle cx="344" cy="250" r="6.5" fill="none" stroke="#2a1a0e" stroke-width="1.25"/>
  <text x="360" y="254" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">documented bet</text>

  <!-- branch: adaptive rows to the equity test -->
  <path d="M408,268 L408,298" fill="none" stroke="#2a1a0e" stroke-width="1.25" marker-end="url(#arrow)"/>
  <text x="418" y="288" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">adaptive rows</text>
  <rect x="372" y="304" width="80" height="48" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="412" y="332" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">EQUITY TEST</text>

  <!-- decline out of the equity test (structural ⊣, not color) -->
  <line x1="452" y1="328" x2="516" y2="328" stroke="#2a1a0e" stroke-width="1.25" stroke-dasharray="4 3"/>
  <line x1="519" y1="319" x2="519" y2="337" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="484" y="316" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">declined</text>
  <text x="484" y="368" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">(the worked example’s vendor module)</text>

  <!-- open endpoint: verification debt -->
  <path d="M488,193 L538,193" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <circle cx="572" cy="193" r="26" fill="none" stroke="#2a1a0e" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="572" y="240" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">verification pending —</text>
  <text x="572" y="254" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">real assistive-tech users</text>

  <text x="32" y="440" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Profiles walk the experience; logged barriers become a change table with one justification logic per row (glyphs as in Fig. 9.1).</text>
  <text x="32" y="454" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Adaptive rows face the equity test; the dashed endpoint is the debt — designed-accessible is not yet verified-accessible.</text>
</svg>
