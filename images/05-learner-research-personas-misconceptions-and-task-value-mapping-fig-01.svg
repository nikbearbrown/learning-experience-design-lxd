  <!-- failure annotation -->
  <text x="48" y="394" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">week-3 assessment: means computed correctly,</text>
  <text x="48" y="408" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454">sample-size decisions confidently wrong</text>
  <line x1="290" y1="398" x2="588" y2="396" stroke="#D4D4D4" stroke-width="1"/>

  <!-- caption -->
  <text x="32" y="462" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Same learner, same card format — only the persona built from learning-relevant variables predicts the week-3 failure.</text>
