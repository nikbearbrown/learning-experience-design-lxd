  <rect x="592" y="388" width="16" height="16" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>
  <g font-family="'JetBrains Mono', 'Fira Code', 'Courier New', monospace" font-size="11" fill="#545454" text-anchor="middle">
    <text x="420" y="418">wk 1</text><text x="510" y="418">wk 2</text><text x="600" y="418">wk 3</text>
