  <text x="273.5" y="300" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">stops when the</text>
  <text x="273.5" y="314" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">regulator stops</text>

  <!-- column 3: internalized — often persists -->
  <line x1="361.5" y1="262" x2="491.5" y2="262" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="361.5" y="256" width="50" height="6" fill="#787878"/>
  <rect x="411.5" y="256" width="50" height="6" fill="#787878" opacity="0.45"/>
  <line x1="411.5" y1="246" x2="411.5" y2="278" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="426.5" y="300" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">often persists</text>

  <!-- column 4: intrinsic — persists -->
  <line x1="514.5" y1="262" x2="644.5" y2="262" stroke="#D4D4D4" stroke-width="1"/>
  <rect x="514.5" y="256" width="130" height="6" fill="#C8102E"/>
  <line x1="564.5" y1="246" x2="564.5" y2="278" stroke="#787878" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="579.5" y="300" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">persists — nothing</text>
  <text x="579.5" y="314" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">external to remove</text>

  <!-- source -->
  <text x="48" y="368" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">SOURCE: ADAPTED FROM DECI &amp; RYAN, SELF-DETERMINATION THEORY</text>

  <!-- caption -->
  <text x="32" y="404" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Motivation varies in kind, not just amount: persistence after the regulator disappears rises with internalization.</text>
