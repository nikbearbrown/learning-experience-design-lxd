  <text x="34" y="244" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the riskiest unknown</text>
  <text x="34" y="258" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">chooses the entry rung</text>
