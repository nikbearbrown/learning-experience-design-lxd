  <text x="32" y="40" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Figure 8.1 · The Fidelity Ladder: Six Rungs, Climbed One Question at a Time</text>

  <text x="96" y="288" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">low fidelity</text>
