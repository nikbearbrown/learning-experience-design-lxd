  <text x="32" y="398" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Six rungs from sketch to pilot; the filled pilot rung is a different kind of test — real learners, real stakes.</text>
  <text x="32" y="412" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">No automatic ascent: the riskiest unknown re-chooses the rung each cycle. Entry at the paper prototype is illustrative.</text>
