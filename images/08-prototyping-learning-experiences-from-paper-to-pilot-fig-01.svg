  <text x="644" y="364" text-anchor="end" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">build cost (ordinal — no figures given)</text>

  <!-- six rungs, ascending -->
  <rect x="96" y="296" width="86" height="40" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
