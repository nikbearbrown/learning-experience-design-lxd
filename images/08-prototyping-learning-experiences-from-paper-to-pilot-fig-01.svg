  <title id="fig-title-01">The Fidelity Ladder — 08-prototyping-learning-experiences-from-paper-to-pilot</title>
  <desc>Six fidelity rungs ascend left to right — sketch/storyboard, paper prototype, Wizard of Oz, clickable mockup, authoring-tool build, pilot module (filled: real stakes). A gray cost wedge rises beneath; a red entry arrow from the riskiest unknown points at the paper-prototype rung.</desc>
