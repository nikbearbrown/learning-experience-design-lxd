  <title id="fig-title-ch03-06">Element Interactivity: Why Some Material Is Heavy — 03-the-cognitive-machinery-load-difficulty-and-durable-learning</title>
  <desc>Low-interactivity material (isolated vocabulary) loads working memory one element at a time, while high-interactivity material (sampling distributions) forces several interdependent elements to be held simultaneously.</desc>
