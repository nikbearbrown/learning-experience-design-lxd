  <!-- Caption -->
  <text x="32" y="412" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Node count is controlled; only the connections differ. The capacity bars are an interpretive addition:</text>
  <text x="32" y="428" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">what loads working memory is how many pieces must be held together simultaneously, not unfamiliarity.</text>
