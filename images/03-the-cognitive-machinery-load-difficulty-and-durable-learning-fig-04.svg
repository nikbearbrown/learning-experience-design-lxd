  <title id="fig-title-ch03-04">The Fade: Expertise Reversal as a Trajectory, Not a Setting — 03-the-cognitive-machinery-load-difficulty-and-durable-learning</title>
  <desc>As expertise grows, instructional guidance should decline while generative demands rise, crossing in a fade zone where schemas are forming — designing for one point on this axis is the most common implementation error (Kalyuga et al. 2003).</desc>
