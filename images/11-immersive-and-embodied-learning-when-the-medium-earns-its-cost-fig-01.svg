<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-11-01">
  <title id="fig-title-11-01">Both media taught; hands-on taught more — the oyster-reef four-condition result — 11-immersive-and-embodied-learning-when-the-medium-earns-its-cost</title>
  <desc>Dot plot on a zero-anchored 0–100 percent axis showing the four measured assessment means from Walters et al. 2026: pre-test 43.2 (hollow), 360° video 62.1, hands-on 83.6 (red highlight), combined 79.6; a bracket marks the authors' reported 31.1 percent hands-on advantage over the 360° video, and shared significance letters show hands-on and combined statistically indistinguishable.</desc>
