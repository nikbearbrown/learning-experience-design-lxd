  <title id="fig-title-ch01-01">The Dissociation: In-Session Performance vs. Delayed Retention — 01-the-engagement-trap-why-learners-love-products-that-dont-teach</title>
  <desc>Conditions that inflate performance during practice (massed, fluent study) can depress delayed retention, while conditions that depress in-session performance (spaced, effortful practice) improve it — the two lines cross.</desc>
