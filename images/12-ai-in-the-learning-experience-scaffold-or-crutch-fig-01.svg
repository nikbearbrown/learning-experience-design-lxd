  <text x="64" y="378" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Deltas vs the no-AI control; all four values carry the chapter's [verify against published paper] flag.</text>
  <text x="64" y="393" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">The unguarded tutor's exam result lands below the control; the guardrailed tutor matches — never beats — it.</text>
  <text x="64" y="411" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" letter-spacing="0.08em">SOURCE: BASTANI ET AL. 2025</text>
