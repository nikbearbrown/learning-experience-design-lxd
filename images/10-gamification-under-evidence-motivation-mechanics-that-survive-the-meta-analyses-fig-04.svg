<!-- Figure 04 — The SDT decomposition: from proposed mechanic to three honest outputs · Chapter 10: Gamification Under Evidence · Experience Design for EdTech · Nik Bear Brown · Generated 2026-06-07 -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-10-04">
  <title id="fig-title-10-04">The SDT decomposition: from proposed mechanic to three honest outputs — 10-gamification-under-evidence-motivation-mechanics-that-survive-the-meta-analyses</title>
  <desc>Left-to-right decision flowchart: a proposed mechanic is classified as need-fed or pure extrinsic reward, passes a starvation check, and is routed to one of three equal terminals — adopt as proposed, redesign then gamify, or do not gamify.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="10-gamification-under-evidence-motivation-mechanics-that-survive-the-meta-analyses" figure-number="04" figure-title="The SDT decomposition: from proposed mechanic to three honest outputs" figure-slug="sdt-decomposition-flow" figure-type="flowchart" priority="important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/10-gamification-under-evidence-motivation-mechanics-that-survive-the-meta-analyses-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
  </defs>

  <text x="64" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">The SDT decomposition: from proposed mechanic to three honest outputs</text>

  <!-- input node -->
  <rect x="36" y="185" width="110" height="50" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="91" y="206" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">proposed</text>
  <text x="91" y="221" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">mechanic</text>
  <line x1="146" y1="210" x2="170" y2="210" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- classification diamond -->
  <polygon points="222,166 270,210 222,254 174,210" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="222" y="206" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">which need</text>
  <text x="222" y="219" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">does it feed?</text>

  <!-- branch: need-fed -->
  <path d="M222 166 L222 145 L284 145" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="160" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454">need-fed</text>
  <rect x="290" y="120" width="150" height="50" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="365" y="140" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">feeds a need</text>
  <text x="365" y="157" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">autonomy · competence · relatedness</text>

  <!-- branch: pure extrinsic -->
  <path d="M222 254 L222 275 L284 275" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="232" y="270" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454">extrinsic only</text>
  <rect x="290" y="250" width="150" height="50" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="365" y="270" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">pure extrinsic reward</text>
  <text x="365" y="287" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9.5" fill="#545454" text-anchor="middle">no need fed — decay liability</text>

  <!-- reconverge into starvation check -->
  <path d="M440 145 L508 145 L508 160" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M440 275 L508 275 L508 260" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- starvation diamond -->
  <polygon points="508,166 550,210 508,254 466,210" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="508" y="206" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">does it starve</text>
  <text x="508" y="219" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#2a1a0e" text-anchor="middle">a need?</text>

  <!-- three equal terminals -->
  <path d="M550 210 C 566 210, 568 133, 584 133" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="550" y1="210" x2="584" y2="210" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 210 C 566 210, 568 287, 584 287" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="588" y="110" width="84" height="46" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="630" y="130" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">adopt</text>
  <text x="630" y="145" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454" text-anchor="middle">no need starved</text>

  <rect x="588" y="187" width="84" height="46" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="630" y="207" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">redesign</text>
  <text x="630" y="222" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454" text-anchor="middle">starvation fixable</text>

  <rect x="588" y="264" width="84" height="46" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="630" y="284" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e" text-anchor="middle">do not gamify</text>
  <text x="630" y="299" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="9" fill="#545454" text-anchor="middle">starvation inherent</text>

  <text x="64" y="378" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Every proposed mechanic is classified by the need it feeds, checked for the need it starves, and routed to one of</text>
  <text x="64" y="393" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">three equally legitimate outputs — declining is not a failure state.</text>
</svg>
