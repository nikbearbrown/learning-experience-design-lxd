<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">The Equity Test: Four Gates Before the Evidence Test — 09-designing-for-variability-udl-accessibility-and-the-equity-test</title>
  <desc>An adaptive proposal passes left to right through four gates — ceiling, exit, visibility and appeal, cohort — before reaching the ordinary evidence test. From every gate a drop leads to a shared decline channel ending in an open holding tray: declined with grounds, the need met another way.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="09-designing-for-variability-udl-accessibility-and-the-equity-test" figure-number="03" figure-title="The Equity Test: Four Gates Before the Evidence Test" figure-slug="equity-test-four-gates" figure-type="sequential-gate-flowchart" priority="Important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/09-designing-for-variability-udl-accessibility-and-the-equity-test-cajal.md"/></metadata>
  <defs>
    <marker id="arrow-red" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#C8102E"/></marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#787878"/></marker>
  </defs>

  <text x="32" y="40" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Figure 9.3 · The Equity Test: Four Gates Before the Evidence Test</text>

  <!-- incoming proposal -->
  <text x="66" y="122" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">adaptive</text>
  <text x="66" y="136" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#2a1a0e">proposal</text>
  <polygon points="66,158 85,169 85,191 66,202 47,191 47,169" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1.5"/>

  <!-- passing route (the single highlighted series) -->
  <path d="M88,180 L126,180" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M218,180 L234,180" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M324,180 L340,180" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M430,180 L446,180" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrow-red)"/>
  <path d="M536,180 L588,180" fill="none" stroke="#C8102E" stroke-width="1.5" marker-end="url(#arrow-red)"/>

  <!-- gate 1: ceiling -->
  <rect x="132" y="128" width="86" height="104" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <line x1="148" y1="150" x2="202" y2="150" stroke="#2a1a0e" stroke-width="2.5"/>
  <text x="175" y="202" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">CEILING</text>

  <!-- gate 2: exit -->
  <rect x="238" y="128" width="86" height="104" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <path d="M270,168 v-16 a11,11 0 0 1 22,0 v16" fill="none" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="281" y="202" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">EXIT</text>

  <!-- gate 3: visibility and appeal -->
  <rect x="344" y="128" width="86" height="104" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <ellipse cx="387" cy="155" rx="16" ry="9" fill="none" stroke="#2a1a0e" stroke-width="1.5"/>
  <circle cx="387" cy="155" r="4" fill="#2a1a0e"/>
  <text x="387" y="198" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">VISIBILITY</text>
  <text x="387" y="212" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">&amp; APPEAL</text>

  <!-- gate 4: cohort -->
  <rect x="450" y="128" width="86" height="104" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <circle cx="484" cy="150" r="3.5" fill="#2a1a0e"/>
  <circle cx="502" cy="150" r="3.5" fill="#2a1a0e"/>
  <circle cx="484" cy="164" r="3.5" fill="#2a1a0e"/>
  <circle cx="502" cy="164" r="3.5" fill="#2a1a0e"/>
  <text x="493" y="202" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" font-weight="bold" fill="#2a1a0e">COHORT</text>

  <!-- evidence-test terminal (deliberately plain) -->
  <circle cx="608" cy="180" r="16" fill="#FFFFFF" stroke="#2a1a0e" stroke-width="1"/>
  <text x="608" y="216" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the ordinary</text>
  <text x="608" y="230" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">evidence test</text>

  <!-- decline drops, one per gate -->
  <path d="M175,232 L175,294" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M281,232 L281,294" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M387,232 L387,294" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M493,232 L493,294" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>

  <!-- shared decline channel into the holding tray -->
  <path d="M510,302 L140,302" fill="none" stroke="#787878" stroke-width="1.25" marker-end="url(#arrow-gray)"/>
  <path d="M134,284 L106,284 L106,320 L134,320" fill="none" stroke="#2a1a0e" stroke-width="1.5"/>
  <text x="106" y="344" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">declined, with grounds named —</text>
  <text x="106" y="358" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the underlying need is met another way</text>

  <text x="32" y="392" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Ceiling: same objective? Exit: a taught way out? Visibility: known &amp; appealable? Cohort: who lands where?</text>
  <text x="32" y="406" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Failing any gate routes to a recorded decline; passing earns only the right to face the evidence test.</text>
</svg>
