  <line x1="250" y1="160" x2="470" y2="310" stroke="#ADADAD" stroke-width="0.75"/>
  <line x1="470" y1="160" x2="250" y2="310" stroke="#ADADAD" stroke-width="0.75"/>
  <!-- vertical connectors -->
  <line x1="250" y1="200" x2="250" y2="294" stroke="#D4D4D4" stroke-width="0.75"/>
  <line x1="470" y1="177" x2="470" y2="271" stroke="#D4D4D4" stroke-width="0.75"/>
