  <text x="32" y="380" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Circle size shows direction only — the chapter reports no magnitudes, so this diagram is conceptual.</text>
  <text x="32" y="394" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Fluency feels like learning in session; durable learning shows up only after the delay.</text>
