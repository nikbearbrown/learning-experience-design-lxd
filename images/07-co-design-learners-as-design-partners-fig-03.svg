<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-03">
  <title id="fig-title-03">The Fluency–Learning Inversion — 07-co-design-learners-as-design-partners</title>
  <desc>Two-by-two grid of circles: the fluent condition is rated high in session but tests low after a delay; the effortful condition is rated low in session but tests high. Crossing gray diagonals make the inversion explicit. Circle sizes are ordinal only — no magnitudes are reported.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="07-co-design-learners-as-design-partners" figure-number="03" figure-title="The Fluency–Learning Inversion" figure-slug="fluency-learning-inversion" figure-type="paired-comparison-conceptual-diagram" priority="Important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/07-co-design-learners-as-design-partners-cajal.md"/></metadata>

  <text x="32" y="40" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Figure 7.3 · The Fluency–Learning Inversion</text>

  <!-- column headers -->
  <text x="250" y="84" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#2a1a0e">FLUENT CONDITION</text>
  <text x="250" y="99" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">massed, smooth, easy in session</text>
  <text x="470" y="84" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#2a1a0e">EFFORTFUL CONDITION</text>
  <text x="470" y="99" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">spaced, interleaved, harder in session</text>

  <!-- row labels -->
  <text x="32" y="155" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#2a1a0e">FELT LEARNING</text>
  <text x="32" y="170" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">self-rated during the session</text>
  <text x="32" y="305" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" font-weight="bold" fill="#2a1a0e">MEASURED LEARNING</text>
  <text x="32" y="320" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">on the delayed test</text>

