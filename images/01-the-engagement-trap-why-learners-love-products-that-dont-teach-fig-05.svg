  <title id="fig-title-ch01-05">The Market Selection Loop — 01-the-engagement-trap-why-learners-love-products-that-dont-teach</title>
  <desc>Iterated A/B testing on observable engagement metrics selects for fluent, pleasant designs and against evidence-backed difficulty, producing products that don't teach without anyone intending it — learning sits outside the loop's measurement.</desc>
