  <text x="146" y="116" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">behavioral</text>
  <!-- tally-mark glyph -->
  <line x1="122" y1="140" x2="122" y2="185" stroke="#787878" stroke-width="2"/>
