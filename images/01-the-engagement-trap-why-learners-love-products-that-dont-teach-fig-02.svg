<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-ch01-02">
  <title id="fig-title-ch01-02">Three Engagement Dimensions and the Dashboard's Blind Spot — 01-the-engagement-trap-why-learners-love-products-that-dont-teach</title>
  <desc>Behavioral and affective engagement are what analytics and surveys can observe; cognitive engagement — the only dimension that predicts learning — falls outside the instrumented zone (Fredricks, Blumenfeld and Paris 2004).</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="01-the-engagement-trap-why-learners-love-products-that-dont-teach" figure-number="02" figure-title="Three Engagement Dimensions and the Dashboard's Blind Spot" figure-slug="three-engagement-dimensions-dashboard-blind-spot" figure-type="comparison-panels" priority="Important" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/01-the-engagement-trap-why-learners-love-products-that-dont-teach-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
