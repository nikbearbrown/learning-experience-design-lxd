  <!-- Caption -->
  <text x="32" y="384" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Only cognitive engagement predicts learning, and it sits outside the instrumented zone</text>
  <text x="32" y="400" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">(Fredricks, Blumenfeld &amp; Paris 2004). The empty space below the first two panels is the point.</text>
