  <text x="514" y="310" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">rivals make abandonment cheap</text>

  <text x="32" y="356" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Parallel teams explored more divergently and produced better-rated final designs; serial refinement breeds commitment.</text>
  <text x="32" y="370" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">“Five” echoes the chapter’s rhetoric, not a prescribed count; total effort in the two panels is comparable.</text>
