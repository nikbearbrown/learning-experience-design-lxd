  <text x="186" y="296" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">each pass deepens investment in the same design —</text>
  <text x="186" y="310" text-anchor="middle" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">by v3 it is an identity, not a hypothesis (double outline)</text>

