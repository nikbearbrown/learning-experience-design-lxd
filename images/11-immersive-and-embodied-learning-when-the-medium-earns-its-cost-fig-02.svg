<!-- Figure 02 — Two mechanisms, one casualty: how the medium taxes the lesson · Chapter 11: Immersive and Embodied Learning · Experience Design for EdTech · Nik Bear Brown · Generated 2026-06-07 -->
<svg viewBox="0 0 700 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fig-title-11-02">
  <title id="fig-title-11-02">Two mechanisms, one casualty: how the medium taxes the lesson — 11-immersive-and-embodied-learning-when-the-medium-earns-its-cost</title>
  <desc>An unfamiliar immersive medium feeds two parallel mechanisms — interface operations and novelty distraction — whose connectors end in blocking bars before the content-schema box; a gray bypass below shows the familiar medium reaching the schema directly.</desc>
  <metadata><cajal:figure xmlns:cajal="https://bearbrown.ai/cajal/1.0" book="Experience Design for EdTech" book-slug="experience-design-for-edtech" chapter="11-immersive-and-embodied-learning-when-the-medium-earns-its-cost" figure-number="02" figure-title="Two mechanisms, one casualty: how the medium taxes the lesson" figure-slug="two-mechanisms-one-casualty" figure-type="mechanism" priority="critical" author="Nik Bear Brown" date-generated="2026-06-07" source-file="pantry/11-immersive-and-embodied-learning-when-the-medium-earns-its-cost-cajal.md"/></metadata>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#2a1a0e"/></marker>
    <marker id="arrowGray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#787878"/></marker>
  </defs>

  <text x="64" y="28" font-family="'EB Garamond', 'Garamond', Georgia, serif" font-size="14" fill="#2a1a0e">Two mechanisms, one casualty: how the medium taxes the lesson</text>

  <!-- medium source node -->
  <rect x="40" y="165" width="130" height="70" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="105" y="195" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">unfamiliar</text>
  <text x="105" y="211" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">immersive medium</text>

  <!-- diverging arrows to the two mechanisms -->
  <path d="M170 185 C 205 185, 215 120, 244 120" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M170 215 C 205 215, 215 280, 244 280" fill="none" stroke="#2a1a0e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- mechanism 1: interface load -->
  <rect x="250" y="90" width="170" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="335" y="115" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">interface operations</text>
  <text x="335" y="132" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="middle">extraneous load on working memory</text>

  <!-- mechanism 2: novelty distraction -->
  <rect x="250" y="250" width="170" height="60" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="335" y="275" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">novelty distraction</text>
  <text x="335" y="292" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="middle">attention drawn to the medium itself</text>

  <!-- blocking connectors (⊣): stop short of the content box -->
  <line x1="420" y1="120" x2="498" y2="120" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="498" y1="108" x2="498" y2="132" stroke="#2a1a0e" stroke-width="2.5"/>
  <line x1="420" y1="280" x2="498" y2="280" stroke="#2a1a0e" stroke-width="1.5"/>
  <line x1="498" y1="268" x2="498" y2="292" stroke="#2a1a0e" stroke-width="2.5"/>

  <!-- content schema node -->
  <rect x="520" y="110" width="145" height="180" fill="#FFFFFF" stroke="#D4D4D4" stroke-width="1"/>
  <text x="592" y="160" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="12" fill="#2a1a0e" text-anchor="middle">content schema</text>
  <text x="592" y="177" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="middle">germane processing</text>
  <!-- small network glyph -->
  <line x1="570" y1="232" x2="592" y2="218" stroke="#787878" stroke-width="1"/>
  <line x1="592" y1="218" x2="614" y2="232" stroke="#787878" stroke-width="1"/>
  <line x1="570" y1="232" x2="592" y2="246" stroke="#787878" stroke-width="1"/>
  <line x1="592" y1="246" x2="614" y2="232" stroke="#787878" stroke-width="1"/>
  <circle cx="592" cy="218" r="4" fill="#787878"/>
  <circle cx="570" cy="232" r="4" fill="#787878"/>
  <circle cx="614" cy="232" r="4" fill="#787878"/>
  <circle cx="592" cy="246" r="4" fill="#787878"/>

  <!-- bypass: familiar medium pays neither tax -->
  <path d="M105 235 L105 345 L592 345 L592 296" fill="none" stroke="#787878" stroke-width="1.5" marker-end="url(#arrowGray)"/>
  <text x="350" y="338" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="10" fill="#545454" text-anchor="middle">familiar medium (the touch tank): no interface tax, no novelty tax</text>

  <text x="64" y="378" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Two distinct, simultaneous channels — interface load and novelty — block the content's germane processing (⊣);</text>
  <text x="64" y="393" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">the familiar medium's route below pays neither tax.</text>
</svg>
