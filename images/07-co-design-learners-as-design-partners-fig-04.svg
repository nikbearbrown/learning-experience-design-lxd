  <text x="32" y="386" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">Every contribution lands in one matrix quadrant, then routes to exactly one disposition — the record that separates co-design from theater.</text>
  <text x="32" y="400" font-family="'Inter', -apple-system, 'Helvetica Neue', sans-serif" font-size="11" fill="#545454">No voice vanishes; rejection carries named grounds (tag). Dot counts are illustrative.</text>
