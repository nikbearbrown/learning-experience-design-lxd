  <desc>Annotated journey-map template: an eight-week calendar spine over five lanes — touchpoints, cognitive load, emotional state, friction, reflection. Cells carry evidence-status fills (solid, hatched, dotted). In week 3 four lanes spike in one column while the reflection lane is empty; weeks 5 and 8 stay deliberately empty.</desc>
